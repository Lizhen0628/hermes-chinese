name: 配置自定义域名 DNS（一次性）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 测试 token 并配置 tools-online.site DNS
        env:
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
        run: |
          set -e
          echo "== token 验证 =="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CF_DNS_API_TOKEN" | head -c 400; echo
          echo "== 列出可见 zones =="
          curl -s "https://api.cloudflare.com/client/v4/zones?per_page=50" \
            -H "Authorization: Bearer $CF_DNS_API_TOKEN" > zones.json
          cat zones.json | head -c 600; echo
          ZONE_ID=$(python3 -c "
          import json
          d = json.load(open('zones.json'))
          for z in d.get('result') or []:
              if z['name'] == 'tools-online.site':
                  print(z['id']); break
          ")
          if [ -z "$ZONE_ID" ]; then
            echo "::error::未见 tools-online.site zone，token 权限不足或账号不符"; exit 1
          fi
          echo "zone id: $ZONE_ID"
          echo "== 查找现有 chinese.hermes 记录 =="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=chinese.hermes.tools-online.site" \
            -H "Authorization: Bearer $CF_DNS_API_TOKEN" > recs.json
          REC_ID=$(python3 -c "
          import json
          d = json.load(open('recs.json'))
          rs = d.get('result') or []
          print(rs[0]['id'] if rs else '')
          ")
          PAYLOAD='{"type":"CNAME","name":"chinese.hermes","content":"hermes-chinese.pages.dev","proxied":true,"comment":"Hermes Agent 中文站 (Cloudflare Pages)"}'
          if [ -n "$REC_ID" ]; then
            echo "== 更新记录 $REC_ID =="
            curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$REC_ID" \
              -H "Authorization: Bearer $CF_DNS_API_TOKEN" -H "Content-Type: application/json" \
              -d "$PAYLOAD"; echo
          else
            echo "== 新建记录 =="
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_DNS_API_TOKEN" -H "Content-Type: application/json" \
              -d "$PAYLOAD"; echo
          fi
